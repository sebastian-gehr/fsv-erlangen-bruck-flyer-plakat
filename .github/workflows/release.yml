name: Release

# Neue Fassung veröffentlichen: auf GitHub unter Actions → Release → „Run workflow“
# die Version eingeben (z. B. v1.1.0), oder ein Tag v* pushen.
# Der Workflow packt den Skill als ZIP, rendert das Beispiel und legt beides als Release ab.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, z. B. v1.1.0'
        required: true
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Beispiel rendern
        run: |
          npm install
          npx playwright install --with-deps chromium
          npm run beispiel

      - name: Skill als ZIP packen
        run: |
          name=fsv-erlangen-bruck-flyer-plakat
          mkdir -p "/tmp/$name"
          cp -r SKILL.md README.md package.json assets beispiele scripts vorlage "/tmp/$name/"
          (cd /tmp && zip -qr "$GITHUB_WORKSPACE/$name.zip" "$name")

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          gh release create "$VERSION" --target "$GITHUB_SHA" \
            --title "Flyer-Skill $VERSION" \
            --notes "Skill-ZIP zum Hochladen in Claude (Einstellungen → Fähigkeiten → Skills) oder zum Entpacken für andere Werkzeuge. Dazu das Beispiel Weihnachtsfeier als PDF und PNG." \
            fsv-erlangen-bruck-flyer-plakat.zip ausgabe/*.pdf ausgabe/*.png
